onboarding = false

[theme]
name = "tokyo-night"
auto_switch = true

[theme.custom]
# panel_bg = "reset"
# accent = "#f5c2e7"
# red = "#ff6188"
# green = "#a6e3a1"

[terminal]
default_shell = "zsh"

[keys]
prefix = "ctrl+space"
# help = "prefix+?"
# settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+ctrl+w"
# open_worktree = "prefix+ctrl+o"
# remove_worktree = "prefix+ctrl+x"
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
previous_workspace = "prefix+ctrl+minus"
next_workspace = "prefix+ctrl+backtick"
previous_agent = "prefix+ctrl+comma"
next_agent = "prefix+ctrl+period"
# focus_agent = ""
new_tab = "prefix+c"
rename_tab = "prefix+T"
previous_tab = "prefix+p"
next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
switch_workspace = "prefix+ctrl+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+-"
close_pane = "prefix+x"
zoom = "prefix+z"
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "jt.command-palette.open"
description = "Command palette"

