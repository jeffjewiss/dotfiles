[ui]
# sidebar_width = 26
sidebar_min_width = 36 
sidebar_max_width = 48
tab_bar_position = "bottom"
# mouse_capture = true
# mouse_scroll_lines = 3
# confirm_close = true
# prompt_new_tab_name = true
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
